[project]
name = "langgraph-ollama-agent"
version = "0.6.0"
description = "Autonomous agent application using LangGraph, Python, and Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.134.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "streamlit>=1.62.0",
    "authlib>=1.3.2",
    "ddgs>=9.16.0",
    "httpx>=0.28.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "uvicorn>=0.52.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
