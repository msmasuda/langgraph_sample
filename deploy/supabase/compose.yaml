name: langgraph-supabase

services:
  studio:
    image: supabase/studio:2026.08.03-sha-022b374
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-LangGraph}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-Development}
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      ENABLED_FEATURES_LOGS_ALL: "false"

  api-gw:
    image: kong/kong:3.9.3
    user: "0:0"
    restart: unless-stopped
    depends_on:
      studio:
        condition: service_healthy
    ports:
      - "${API_GW_HTTP_PORT:-8000}:8000"
    configs:
      - source: kong_config
        target: /tmp/kong.yml
    environment:
      KONG_DATABASE: "off"
      # configs.content の変更だけでは再作成されないCompose環境でも鍵更新を反映する。
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_KEYS: ${JWT_KEYS}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

  meta:
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data-v2:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      AUTH_ROLE_SQL: |
        \set pgpass `echo "$$POSTGRES_PASSWORD"`
        SET log_statement = 'none';
        ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        printf '%s\n' "$$AUTH_ROLE_SQL" > /docker-entrypoint-initdb.d/init-scripts/99-auth-role.sql
        chmod 0644 /docker-entrypoint-initdb.d/init-scripts/99-auth-role.sql
        exec /usr/local/bin/docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf

volumes:
  postgres-data-v2:
  db-config:

configs:
  kong_config:
    content: |
      _format_version: "2.1"
      _transform: true

      consumers:
        - username: DASHBOARD
        - username: anon
          keyauth_credentials:
            - key: ${ANON_KEY}
            - key: ${SUPABASE_PUBLISHABLE_KEY}
        - username: service_role
          keyauth_credentials:
            - key: ${SERVICE_ROLE_KEY}
            - key: ${SUPABASE_SECRET_KEY}

      acls:
        - consumer: anon
          group: anon
        - consumer: service_role
          group: admin

      basicauth_credentials:
        - consumer: DASHBOARD
          username: ${DASHBOARD_USERNAME}
          password: ${DASHBOARD_PASSWORD}

      services:
        - name: auth-v1-verify
          url: http://auth:9999/verify
          routes:
            - name: auth-v1-verify
              strip_path: true
              paths: [/auth/v1/verify]
          plugins:
            - name: cors

        - name: auth-v1-callback
          url: http://auth:9999/callback
          routes:
            - name: auth-v1-callback
              strip_path: true
              paths: [/auth/v1/callback]
          plugins:
            - name: cors

        - name: auth-v1-authorize
          url: http://auth:9999/authorize
          routes:
            - name: auth-v1-authorize
              strip_path: true
              paths: [/auth/v1/authorize]
          plugins:
            - name: cors

        - name: auth-v1-jwks
          url: http://auth:9999/.well-known/jwks.json
          routes:
            - name: auth-v1-jwks
              strip_path: true
              paths: [/auth/v1/.well-known/jwks.json]
          plugins:
            - name: cors

        - name: oauth-metadata
          url: http://auth:9999/.well-known/oauth-authorization-server
          routes:
            - name: oauth-metadata
              strip_path: true
              paths: [/.well-known/oauth-authorization-server]
          plugins:
            - name: cors

        - name: auth-v1
          url: http://auth:9999/
          routes:
            - name: auth-v1-all
              strip_path: true
              paths: [/auth/v1/]
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '${SUPABASE_SECRET_KEY}' and 'Bearer ${SERVICE_ROLE_KEY_ASYMMETRIC}') or (headers.apikey == '${SUPABASE_PUBLISHABLE_KEY}' and 'Bearer ${ANON_KEY_ASYMMETRIC}') or headers.apikey)"
                replace:
                  headers:
                    - "Authorization: $$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '${SUPABASE_SECRET_KEY}' and 'Bearer ${SERVICE_ROLE_KEY_ASYMMETRIC}') or (headers.apikey == '${SUPABASE_PUBLISHABLE_KEY}' and 'Bearer ${ANON_KEY_ASYMMETRIC}') or headers.apikey)"
            - name: acl
              config:
                hide_groups_header: true
                allow: [admin, anon]

        - name: meta
          url: http://meta:8080/
          routes:
            - name: meta-all
              strip_path: true
              paths: [/pg/]
          plugins:
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow: [admin]

        - name: mcp-blocker
          url: http://studio:3000/api/mcp
          routes:
            - name: mcp-blocker
              strip_path: true
              paths: [/api/mcp, /mcp]
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: Access is forbidden.

        - name: dashboard
          url: http://studio:3000/
          routes:
            - name: dashboard-all
              strip_path: true
              paths: [/]
          plugins:
            - name: cors
            - name: basic-auth
              config:
                hide_credentials: true
